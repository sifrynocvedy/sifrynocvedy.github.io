<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Šifry noc vědy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* SOFTER NEOACID / GLOW AESTHETIC */
        :root {
            --bg-base: #000000;
            --bg-glow: #120303; /* Lehký nádech červené do pozadí */
            --red-main: #e83838; /* Měkčí červená, méně agresivní na oči */
            --red-dark: #4a1212;
            --acid-green: #c4f533;
            --text-main: #e0d8d8;
            --glow-red-soft: rgba(232, 56, 56, 0.2);
            --glow-red-strong: rgba(232, 56, 56, 0.5);
            --glow-green-soft: rgba(196, 245, 51, 0.3);
            --glow-green-strong: rgba(196, 245, 51, 0.6);
        }

        /* GLOBÁLNÍ ZELENÝ REŽIM PŘI DOKONČENÍ */
        body.all-solved {
            --bg-glow: #041203;
            --red-main: var(--acid-green);
            --red-dark: #1b380a;
            --glow-red-soft: var(--glow-green-soft);
            --glow-red-strong: var(--glow-green-strong);
        }

        /* STRICTLY NO ROUNDED CORNERS */
        * {
            box-sizing: border-box;
            border-radius: 0 !important; 
        }

        body {
            /* Jemný haze efekt na pozadí místo ploché černé */
            background: radial-gradient(circle at center, var(--bg-glow) 0%, var(--bg-base) 100%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Space Mono', 'Courier New', Courier, monospace;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }

        .terminal-container {
            width: 100%;
            max-width: 600px;
            background: rgba(5, 0, 0, 0.8); /* Poloprůhledný podklad pro lepší hloubku */
            border: 2px solid var(--red-main);
            padding: 2rem;
            /* Haze glow kolem hlavního kontejneru místo tvrdého stínu */
            box-shadow: 0 0 40px var(--glow-red-soft), inset 0 0 20px var(--glow-red-soft); 
            margin-bottom: 2rem;
            position: relative;
            z-index: 1;
            transition: border-color 0.8s ease, box-shadow 0.8s ease;
        }

        #main-header {
            color: var(--red-main);
            background-color: transparent;
            text-transform: uppercase;
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            letter-spacing: 3px;
            padding-bottom: 10px;
            text-align: center;
            font-weight: 700;
            border-bottom: 1px solid var(--red-main);
            /* Haze na textu */
            text-shadow: 0 0 10px var(--glow-red-strong);
            transition: color 0.8s ease, border-color 0.8s ease, text-shadow 0.8s ease;
        }

        #main-header.success {
            color: var(--acid-green);
            border-color: var(--acid-green);
            text-shadow: 0 0 10px var(--glow-green-soft);
        }

        .instructions {
            color: var(--red-main);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            text-transform: uppercase;
            line-height: 1.5;
            font-weight: 700;
            text-shadow: 0 0 5px var(--glow-red-soft);
            transition: color 0.8s ease, text-shadow 0.8s ease;
        }

        .cipher-block {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border: 1px solid var(--red-dark);
            background: rgba(10, 2, 2, 0.5);
            transition: all 0.3s ease;
        }

        .cipher-block:focus-within {
            border-color: var(--red-main);
            box-shadow: 0 0 15px var(--glow-red-soft);
        }

        label {
            display: block;
            color: var(--red-main);
            margin-bottom: 0.75rem;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px var(--glow-red-soft);
            transition: color 0.8s ease, text-shadow 0.8s ease;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            color: var(--red-main);
            border: 1px solid var(--red-main);
            padding: 1rem;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            outline: none;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px var(--glow-red-soft);
        }

        input[type="text"]:focus {
            background: rgba(232, 56, 56, 0.1);
            box-shadow: inset 0 0 15px var(--glow-red-soft);
        }

        body.all-solved input[type="text"]:focus {
            background: rgba(196, 245, 51, 0.1);
        }

        input[type="text"]:disabled {
            background: rgba(0, 0, 0, 0.8);
            color: var(--acid-green);
            border-color: var(--red-dark);
            text-shadow: 0 0 8px var(--glow-green-soft);
        }

        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            gap: 1rem;
        }

        button {
            background: transparent;
            color: var(--red-main);
            border: 1px solid var(--red-main);
            padding: 0.75rem 2rem;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            text-shadow: 0 0 5px var(--glow-red-soft);
            box-shadow: 0 0 10px inset transparent;
        }

        button:hover:not(:disabled) {
            background: var(--red-main);
            color: var(--bg-base);
            box-shadow: 0 0 15px var(--glow-red-strong);
            text-shadow: none;
        }

        button:disabled {
            background: rgba(20, 20, 20, 0.8);
            color: #444;
            border-color: #333;
            text-shadow: none;
            cursor: not-allowed;
            box-shadow: none;
        }

        body.all-solved button:disabled {
            border-color: var(--red-dark);
            color: rgba(196, 245, 51, 0.6);
            background: rgba(10, 25, 5, 0.6);
        }

        .status {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-align: right;
            flex-grow: 1;
        }

        .status.correct {
            color: var(--acid-green);
            text-shadow: 0 0 8px var(--glow-green-soft);
        }

        .status.incorrect {
            color: var(--red-main);
            text-shadow: 0 0 8px var(--glow-red-strong);
        }

        /* MOBILE SUPPORT */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.5rem;
            }

            .terminal-container {
                padding: 1.25rem;
                box-shadow: 0 0 20px var(--glow-red-soft), inset 0 0 10px var(--glow-red-soft); 
            }

            #main-header {
                font-size: 1.3rem;
                letter-spacing: 2px;
            }

            .action-row {
                flex-direction: column-reverse;
                align-items: stretch;
            }

            .status {
                text-align: center;
                margin-bottom: 0.5rem;
            }

            button {
                width: 100%;
                padding: 1rem;
            }

            input[type="text"] {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <h1 id="main-header">Šifry z Noci Vědy</h1>
        <div class="instructions" id="instructions">
            Zadejte dešifrovaná slova, žádná diakritika a pouze velká písmena.
        </div>

        <div class="cipher-block">
            <label for="cipher1">Šifra 1: Čtvrté slovo zprávy</label>
            <input type="text" id="cipher1" autocomplete="off">
            <div class="action-row">
                <span class="status" id="status1"></span>
                <button type="button" id="btn1" onclick="checkCipher(1)">Ověřit</button>
            </div>
        </div>
        
        <div class="cipher-block">
            <label for="cipher2">Šifra 2: Prvních šest znaků zprávy</label>
            <input type="text" id="cipher2" autocomplete="off">
            <div class="action-row">
                <span class="status" id="status2"></span>
                <button type="button" id="btn2" onclick="checkCipher(2)">Ověřit</button>
            </div>
        </div>
        
        <div class="cipher-block">
            <label for="cipher3">Šifra 3: Poslední slovo zprávy</label>
            <input type="text" id="cipher3" autocomplete="off">
            <div class="action-row">
                <span class="status" id="status3"></span>
                <button type="button" id="btn3" onclick="checkCipher(3)">Ověřit</button>
            </div>
        </div>
        
        <div class="cipher-block">
            <label for="cipher4">Šifra 4: Co/kdo ti má pomoct?</label>
            <input type="text" id="cipher4" autocomplete="off">
            <div class="action-row">
                <span class="status" id="status4"></span>
                <button type="button" id="btn4" onclick="checkCipher(4)">Ověřit</button>
            </div>
        </div>
        
        <div class="cipher-block" style="margin-bottom: 0;">
            <label for="cipher5">Šifra 5: Jaké slovo se opakuje?</label>
            <input type="text" id="cipher5" autocomplete="off">
            <div class="action-row">
                <span class="status" id="status5"></span>
                <button type="button" id="btn5" onclick="checkCipher(5)">Ověřit</button>
            </div>
        </div>
    </div>

    <script>
       const ANSWERS = {
            1: "8b819df96b728f7f59f6b42903306b5507a7e6311ce998242a65bf535d126afc",
            2: "62b8ce06186511868e26442362a19c0a187f233f925c762c0e26036fe8a92c31",
            3: "e58360bdaa0897c3a73819472f8079f3cbc387ac93c4717fd5f500fe2be54712",
            4: "9e2b59424bcc741c5560d66cda2a3f2c640a2cbd357ba2f8a82db8d971b1372e",
            5: "7481e2b52819f28b57a8d75faa8b4bbddeb009cc3c2044cf12cc7973056cc026"
        };

        let solved = {
            1: false,
            2: false,
            3: false,
            4: false,
            5: false
        };

        function normalizeText(text) {
            return text.trim().toUpperCase().replace(/\s+/g, '');
        }
        
        async function hashText(text) {
            const msgUint8 = new TextEncoder().encode(text); 
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkCipher(number) {
            if (solved[number]) return;

            const userInput = document.getElementById('cipher' + number).value;
            const statusSpan = document.getElementById('status' + number);
            const btn = document.getElementById('btn' + number);

            const hashedInput = await hashText(normalizeText(userInput));

            if (hashedInput === ANSWERS[number]) {
                statusSpan.textContent = "[ SPRÁVNĚ ]";
                statusSpan.className = "status correct";
                solved[number] = true;
                
                // Uzamknutí po správném zadání
                document.getElementById('cipher' + number).disabled = true;
                btn.disabled = true;
                btn.textContent = "VYŘEŠENO";

                checkIfAllDone();
            } else {
                statusSpan.textContent = "[ ŠPATNĚ ]";
                statusSpan.className = "status incorrect";
                
                // Efekt probliknutí červeného haze při chybě
                const inputField = document.getElementById('cipher' + number);
                inputField.style.backgroundColor = "rgba(232, 56, 56, 0.2)";
                setTimeout(() => {
                    inputField.style.backgroundColor = "";
                }, 200);
            }
        }

        function checkIfAllDone() {
            if (solved[1] && solved[2] && solved[3] && solved[4] && solved[5]) {
                setTimeout(() => {
                    // Přepnutí celé barevné palety stránky na zelenou
                    document.body.classList.add("all-solved");

                    const header = document.getElementById('main-header');
                    header.textContent = "// VŠE VYŘEŠENO //";
                    header.className = "success";
                    
                    const instructions = document.getElementById('instructions');
                    instructions.innerHTML = "DOBRÁ PRÁCE KRYPTOANALYTIKU*ČKO.";
                    instructions.style.color = "var(--acid-green)";
                    instructions.style.textShadow = "0 0 8px var(--glow-green-soft)";
                }, 400);
            }
        }
        
        document.querySelectorAll('input[type="text"]').forEach(input => {
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    // Extracts the number from 'cipher1' to target 'btn1'
                    const buttonId = this.id.replace('cipher', 'btn');
                    document.getElementById(buttonId).click();
                }
            });
        });
    </script>
</body>
</html>
